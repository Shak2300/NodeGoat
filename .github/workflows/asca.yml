name: ASCA - AI Secure Coding Assistant

# UNVERIFIED. Unlike 2ms.yml and kics.yml, this one has not been run.
# ASCA is designed to run in the IDE, not in CI, and Checkmarx publishes no
# ASCA GitHub Action. Read ASCA-workflow-notes.md before you use or show this.
#
# ASCA scans ONE FILE at a time, so this loops over the files a pull request
# actually changed rather than scanning the repository. That is the honest
# shape of it: a per-file linter, not a project scan.

on:
  pull_request:
  workflow_dispatch:

jobs:
  asca-scan:
    name: ASCA on changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need the base commit to work out what the PR changed.
          fetch-depth: 0

      - name: Install the Checkmarx One CLI
        run: |
          curl -sSL https://github.com/Checkmarx/ast-cli/releases/latest/download/ast-cli_linux_x64.tar.gz \
            -o cx.tar.gz
          tar -xzf cx.tar.gz
          sudo mv cx /usr/local/bin/cx
          cx version

      - name: Work out which files changed
        id: changed
        run: |
          # ASCA supports Java, JavaScript, C#, Go and Python.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ]; then BASE=$(git rev-parse HEAD~1); HEAD=$(git rev-parse HEAD); fi
          git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" \
            | grep -E '\.(java|js|jsx|cs|go|py)$' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "Files to scan:"; cat changed.txt

      - name: Run ASCA on each changed file
        if: steps.changed.outputs.count != '0'
        env:
          # ASCA runs a local engine. If your tenant requires authentication for
          # the CLI, add these as repository secrets and they get picked up here.
          CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
          CX_TENANT: ${{ secrets.CX_TENANT }}
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
        run: |
          mkdir -p asca-results
          FAILED=0
          while read -r FILE; do
            echo "::group::ASCA $FILE"
            SAFE=$(echo "$FILE" | tr '/' '_')
            if cx scan asca --file-source "$FILE" --asca-latest-version \
                 | tee "asca-results/${SAFE}.txt"; then
              :
            else
              FAILED=1
            fi
            echo "::endgroup::"
          done < changed.txt
          exit $FAILED

      - name: Upload results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asca-report
          path: asca-results/
          retention-days: 14

      # Deliberately not gating merges on this.
      # ASCA is a best-practice scanner for single files, and its own docs say the
      # results are not comprehensive. Blocking a merge on it would be claiming
      # more than the engine claims for itself. Gate on 2MS and KICS instead.
